  <style>
    :root {
      --bg-dark: #2a080c;
      --card-bg: #1c0507;
      --border-color: #5c1b22;

      --gold-light: #f6e05e;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
      --danger-red: #e53e3e;
      --warning-amber: #dd6b20;
      --success-green: #38a169;
      --status-fuchsia: #d946ef;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; font-size: 16px; }

    header { background: #1c0507; border-bottom: 2px solid var(--border-color); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-badge { background: linear-gradient(135deg, #f6e05e, #b7791f); color: #000; font-weight: 900; padding: 8px 14px; border-radius: 10px; font-size: 20px; }
    .brand-title { color: var(--gold-light); font-size: 20px; font-weight: bold; letter-spacing: 1px; }

    .nav-tabs { display: flex; background: #2a080c; padding: 4px; border-radius: 12px; border: 1.5px solid var(--border-color); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #d69e2e, #b7791f); color: #000; }

    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input, .select-filter { background: var(--card-bg); border: 1.5px solid var(--border-color); color: #fff; padding: 14px; border-radius: 12px; font-size: 16px; outline: none; }
    .search-input { flex: 1; min-width: 240px; }
    .btn-gold { background: linear-gradient(135deg, #d69e2e, #b7791f); color: #000; border: none; padding: 14px 22px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }

    .card { background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 22px; margin-bottom: 20px; position: relative; }
    .client-badge { background: rgba(214, 158, 46, 0.2); color: var(--gold-light); border: 1.5px solid rgba(214, 158, 46, 0.4); font-size: 13px; padding: 4px 12px; border-radius: 8px; font-weight: bold; margin-bottom: 8px; display: inline-block; }
    .card-title { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 14px; }

    .alert-banner { padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: bold; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .alert-rejected { background: rgba(229, 62, 62, 0.25); color: #fc8181; border: 1.5px solid var(--danger-red); }
    .alert-warning { background: rgba(221, 107, 32, 0.25); color: #fbd38d; border: 1.5px solid var(--warning-amber); animation: pulse-warn 2s infinite; }

    @keyframes pulse-warn {
      0% { box-shadow: 0 0 0 0 rgba(221, 107, 32, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(221, 107, 32, 0); }
      100% { box-shadow: 0 0 0 0 rgba(221, 107, 32, 0); }
    }
