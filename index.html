<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Ticket Company - Workflow & To-Do Manager</title>
  
  <style>
    :root {
      --bg-dark: #2a080c;
      --card-bg: #1c0507;
      --border-color: #5c1b22;
      --gold-main: #d69e2e;
      --gold-light: #f6e05e;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
      --danger-red: #e53e3e;
      --warning-amber: #dd6b20;
      --success-green: #38a169;
      --status-fuchsia: #d946ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; font-size: 16px; scroll-behavior: smooth; overflow-x: hidden; }

    header { background: #1c0507; border-bottom: 2px solid var(--border-color); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-badge { background: linear-gradient(135deg, #f6e05e, #b7791f); color: #000; font-weight: 900; padding: 8px 14px; border-radius: 10px; font-size: 20px; }
    .brand-title { color: var(--gold-light); font-size: 20px; font-weight: bold; letter-spacing: 1px; }

    .nav-tabs { display: flex; background: #2a080c; padding: 4px; border-radius: 12px; border: 1.5px solid var(--border-color); flex-wrap: wrap; gap: 4px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #d69e2e, #b7791f); color: #000; }

    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input, .select-filter { background: var(--card-bg); border: 1.5px solid var(--border-color); color: #fff; padding: 14px; border-radius: 12px; font-size: 16px; outline: none; }
    .search-input { flex: 1; min-width: 220px; }
    .select-filter { min-width: 180px; }
    .btn-gold { background: linear-gradient(135deg, #d69e2e, #b7791f); color: #000; border: none; padding: 14px 22px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }

    .card { background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 16px; padding: 22px; margin-bottom: 20px; position: relative; }
    .client-title-main { font-size: 22px; font-weight: 900; color: var(--gold-light); margin-bottom: 4px; letter-spacing: 0.5px; }
    .card-show-title { font-size: 15px; color: var(--text-muted); font-weight: bold; }

    .alert-banner { padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .alert-rejected { background: rgba(229, 62, 62, 0.2); color: #fc8181; border: 1.5px solid var(--danger-red); }
    .alert-warning { background: rgba(221, 107, 32, 0.25); color: #fbd38d; border: 1.5px solid var(--warning-amber); }
    .alert-status { background: rgba(217, 70, 239, 0.15); color: #f5d0fe; border: 1.5px solid var(--status-fuchsia); }
    .alert-archive { background: rgba(56, 161, 105, 0.2); color: #68d391; border: 1.5px solid var(--success-green); }

    .btn-solve-sm { background: var(--success-green); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    .stepper-box { background: #2a080c; padding: 14px 10px; border-radius: 12px; border: 1.5px solid var(--border-color); margin: 16px 0; }
    .stepper { display: flex; justify-content: space-between; align-items: center; overflow-x: auto; padding: 6px 2px; gap: 12px; -webkit-overflow-scrolling: touch; }
    .step-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 65px; flex-shrink: 0; }
    .step-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; background: #3a0d12; color: var(--text-muted); border: 2px solid var(--border-color); }
    .step-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; font-weight: bold; white-space: nowrap; }

    .step-circle.done { background: var(--success-green) !important; color: #fff !important; border: none !important; }
    .step-circle.current-fuchsia { background: var(--status-fuchsia) !important; color: #fff !important; border: 2.5px solid #f472b6 !important; }
    .step-circle.status-purple { background: #a855f7 !important; color: #fff !important; border: 2.5px solid #d8b4fe !important; }
    .step-circle.warning-alert { background: var(--warning-amber) !important; color: #fff !important; border: 2.5px solid #fbd38d !important; }
    .step-circle.rejected { background: var(--danger-red) !important; color: #fff !important; }
    .step-circle.has-mail { background: #2563eb !important; color: #fff !important; border: 2.5px solid #93c5fd !important; }

    .todo-card { background: var(--card-bg); border: 1.5px solid var(--border-color); padding: 16px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; overflow: hidden; }
    .todo-badge { background: rgba(214, 158, 46, 0.2); color: var(--gold-light); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 6px; margin-right: 4px; }
    .todo-badge.green { background: rgba(56, 161, 105, 0.3); color: #68d391; border: 1px solid var(--success-green); }
    .todo-badge.assignee { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border: 1px solid #2563eb; }
    .todo-badge.deadline { background: rgba(221, 107, 32, 0.25); color: #fbd38d; border: 1px solid var(--warning-amber); }

    .chat-msg-text, .todo-text-block { word-break: break-all; overflow-wrap: break-word; }
    .chat-msg-text a, .todo-text-block a, .link-item-card a { color: var(--gold-light); text-decoration: underline; font-weight: bold; word-break: break-all; overflow-wrap: break-word; }

    .btn-sm { padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; }
    .btn-danger-outline { background: rgba(229, 62, 62, 0.15); color: #fc8181; border: 1.5px solid rgba(229, 62, 62, 0.4); }
    .btn-secondary-outline { background: rgba(214, 158, 46, 0.15); color: var(--gold-light); border: 1.5px solid rgba(214, 158, 46, 0.4); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.hidden { display: none; }
    .modal-card { background: var(--card-bg); border: 2px solid var(--border-color); width: 100%; max-width: 560px; border-radius: 18px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-title { font-size: 18px; font-weight: bold; color: var(--gold-light); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold; }
    .form-control { width: 100%; background: #2a080c; border: 1.5px solid var(--border-color); color: #fff; padding: 12px; border-radius: 10px; font-size: 15px; }
    .form-control-lg { font-size: 18px; font-weight: bold; padding: 14px; border: 2px solid var(--gold-main); color: var(--gold-light); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">GT</div>
      <div class="brand-title">GOLDEN TICKET CLOUD</div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="btnTabFlussi" onclick="switchTab('flussi')">📊 Flussi</button>
      <button class="tab-btn" id="btnTabTodo" onclick="switchTab('todo')">📋 To-Do List</button>
      <button class="tab-btn" id="btnTabLinks" onclick="switchTab('links')">🔗 Link Utili</button>
    </div>
  </header>

  <div class="container">
    <!-- SEZIONE FLUSSI -->
    <div id="sectionFlussi">
      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" oninput="renderApp()" placeholder="Cerca spettacolo o teatro...">
        <select id="filterShowTitle" class="select-filter" onchange="renderApp()">
          <option value="ALL">🎭 Tutti gli Spettacoli</option>
        </select>
        <select id="filterDept" class="select-filter" onchange="renderApp()">
          <option value="ALL">🏢 Tutti i Reparti</option>
          <option value="Prospect">Prospect</option>
          <option value="Tech Serv">Tech Serv</option>
          <option value="Admin">Admin</option>
          <option value="Deal">Deal</option>
          <option value="Legal">Legal</option>
          <option value="Promo">Promo</option>
          <option value="PR">PR</option>
          <option value="Logistics">Logistics</option>
        </select>
        <button class="btn-gold" onclick="openNewModal()">+ Nuova Pratica</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; background: rgba(28,5,7,0.7); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color);">
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-secondary-outline btn-sm" onclick="expandAllCards()">📂 Espandi Tutto</button>
          <button type="button" class="btn-secondary-outline btn-sm" onclick="collapseAllCards()">📁 Compatta Tutto</button>
        </div>
        <div>
          <button type="button" class="btn-secondary-outline btn-sm" style="background: rgba(56, 161, 105, 0.15); border-color: var(--success-green); color: #68d391;" onclick="openArchiveModal()">📦 Pratiche Archiviate (<span id="archiveCountBadge">0</span>)</button>
        </div>
      </div>

      <div id="feedList"></div>
    </div>

    <!-- SEZIONE TO-DO LIST -->
    <div id="sectionTodo" style="display: none;">
      <div class="toolbar">
        <input type="text" id="searchTodoInput" class="search-input" oninput="renderApp()" placeholder="Cerca task o attività...">
        <select id="filterTodoDept" class="select-filter" onchange="renderApp()">
          <option value="ALL">Tutti i Reparti</option>
          <option value="Prospect">Prospect</option>
          <option value="Tech Serv">Tech Serv</option>
          <option value="Admin">Admin</option>
          <option value="Deal">Deal</option>
          <option value="Legal">Legal</option>
          <option value="Promo">Promo</option>
          <option value="PR">PR</option>
          <option value="Logistics">Logistics</option>
        </select>
        <button class="btn-gold" onclick="openTodoModal()">+ Task Manuale</button>
      </div>
      <div id="todoList"></div>
    </div>

    <!-- SEZIONE LINK UTILI -->
    <div id="sectionLinks" style="display: none;">
      <div class="toolbar">
        <input type="text" id="searchLinkInput" class="search-input" oninput="renderLinksList()" placeholder="Cerca link o descrizione...">
        <button class="btn-gold" onclick="openLinkModal()">+ Aggiungi Link</button>
      </div>
      <div id="linksListContainer"></div>
    </div>
  </div>

  <!-- MODAL: GESTIONE REPARTO -->
  <div class="modal-overlay hidden" id="stepClickModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="stepClickTitle">Gestione Reparto</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeStepClickModal()">✕</button>
      </div>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 18px;">Seleziona l'azione da eseguire per questo reparto:</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn-gold" id="btnApproveNext" style="display:none; padding: 14px; font-size:15px;" onclick="approveAndNext()">✅ Approva e Passa Avanti</button>
        <button class="btn-gold" id="btnExecuteFinal" style="display:none; background: var(--success-green); color:#fff; padding: 14px; font-size:15px;" onclick="executeFinalDepartment()">✅ ESEGUITO</button>
        <button class="btn-sm" style="background: #a855f7; color:#fff; padding: 14px; font-size:15px;" onclick="openStatusModal()">🟣 Segnala Stallo / Attesa</button>
        <button class="btn-sm" style="background: var(--warning-amber); color:#fff; padding: 14px; font-size:15px;" onclick="openSendBackModal()">↩️ Rimanda Indietro</button>
        <button class="btn-sm" style="background: var(--danger-red); color:#fff; padding: 14px; font-size:15px;" onclick="openInterveneFromStepClick()">❌ Blocca / Annulla</button>
      </div>
    </div>
  </div>

  <!-- MODAL CONSULTA CHAT -->
  <div class="modal-overlay hidden" id="chatModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="chatModalTitle">Consulta Chat & Storico</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeChatModal()">✕</button>
      </div>
      <div id="chatMessages" style="max-height: 380px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- MODAL NUOVA PRATICA -->
  <div class="modal-overlay hidden" id="newModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Nuova Pratica Spettacolo</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeNewModal()">✕</button>
      </div>
      <form onsubmit="savePratica(event)">
        <div class="form-group">
          <label style="color: var(--gold-light); font-size: 15px;">Teatro / Committente *</label>
          <input type="text" id="formClient" class="form-control form-control-lg" required placeholder="Es. Teatro Politeama...">
        </div>
        <div class="form-group">
          <label>Titolo dello Spettacolo *</label>
          <input type="text" id="formTitle" class="form-control" required placeholder="Es. Caravaggio Rock Musical...">
        </div>
        <div class="form-group">
          <label>Data dello Spettacolo (Opzionale)</label>
          <input type="date" id="formShowDate" class="form-control">
        </div>
        <div class="form-group">
          <label>Referente Esterno (Opzionale)</label>
          <input type="text" id="formOwnerExt" class="form-control" placeholder="Es. Mario Rossi...">
        </div>
        <div class="form-group">
          <label>Referente Interno (Opzionale)</label>
          <input type="text" id="formOwnerInt" class="form-control" placeholder="Es. Bea / Fulvio...">
        </div>
        <div style="text-align: right; margin-top: 18px;">
          <button type="submit" class="btn-gold">Crea Pratica</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL TASK MANUALE -->
  <div class="modal-overlay hidden" id="todoModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Aggiungi Task Manuale</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeTodoModal()">✕</button>
      </div>
      <form onsubmit="saveManualTodo(event)">
        <div class="form-group">
          <label>Titolo Attività *</label>
          <input type="text" id="todoTitle" class="form-control" required placeholder="Es. Chiamare teatro...">
        </div>
        <div class="form-group">
          <label>Reparto di Riferimento *</label>
          <select id="todoSit" class="form-control" required>
            <option value="Prospect">Prospect</option>
            <option value="Tech Serv">Tech Serv</option>
            <option value="Admin">Admin</option>
            <option value="Deal">Deal</option>
            <option value="Legal">Legal</option>
            <option value="Promo">Promo</option>
            <option value="PR">PR</option>
            <option value="Logistics">Logistics</option>
          </select>
        </div>
        <div class="form-group">
          <label>Chi deve farlo (Assegnato a)</label>
          <input type="text" id="todoAssignee" class="form-control" placeholder="Es. Bea, Fulvio...">
        </div>
        <div class="form-group">
          <label>Azione da fare *</label>
          <input type="text" id="todoAction" class="form-control" required placeholder="Es. Inviare materiali...">
        </div>
        <div style="text-align: right; margin-top: 18px;">
          <button type="submit" class="btn-gold">Aggiungi a To-Do</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LINK UTILI -->
  <div class="modal-overlay hidden" id="linkModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Aggiungi Link Utile</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeLinkModal()">✕</button>
      </div>
      <form onsubmit="saveLinkItem(event)">
        <div class="form-group">
          <label>Titolo *</label>
          <input type="text" id="linkTitleInput" class="form-control" required placeholder="Es. Materiale Promozionale Caravaggio...">
        </div>
        <div class="form-group">
          <label>Descrizione *</label>
          <textarea id="linkDescInput" class="form-control" rows="3" required placeholder="Es. Cartella Drive foto ad alta risoluzione..."></textarea>
        </div>
        <div class="form-group">
          <label>Link (URL) *</label>
          <input type="text" id="linkUrlInput" class="form-control" required placeholder="https://...">
        </div>
        <div style="text-align: right; margin-top: 18px;">
          <button type="submit" class="btn-gold">Salva Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ARCHIVIO -->
  <div class="modal-overlay hidden" id="archiveModal">
    <div class="modal-card" style="max-width: 700px;">
      <div class="modal-header">
        <div class="modal-title">📦 Pratiche Archiviate</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeArchiveModal()">✕</button>
      </div>
      <div id="archiveListContainer" style="max-height: 450px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- MODAL STALLO -->
  <div class="modal-overlay hidden" id="statusModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Segnala Stallo / Attesa</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeStatusModal()">✕</button>
      </div>
      <form onsubmit="saveDepartmentStatus(event)">
        <div class="form-group">
          <label>Motivo dello Stallo *</label>
          <textarea id="statusNoteInput" class="form-control" rows="3" required placeholder="Es. In attesa di risposta..."></textarea>
        </div>
        <div style="text-align: right; margin-top: 18px;"><button type="submit" class="btn-gold">Conferma</button></div>
      </form>
    </div>
  </div>

  <!-- MODAL RIMANDA -->
  <div class="modal-overlay hidden" id="sendBackModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Rimanda Reparto</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeSendBackModal()">✕</button>
      </div>
      <form onsubmit="saveSendBackAction(event)">
        <div class="form-group">
          <label>A quale Reparto?</label>
          <select id="sendBackTargetSelect" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Motivo *</label>
          <textarea id="sendBackNoteInput" class="form-control" rows="3" required></textarea>
        </div>
        <div style="text-align: right; margin-top: 18px;"><button type="submit" class="btn-gold">Conferma</button></div>
      </form>
    </div>
  </div>

  <!-- MODAL BLOCCA -->
  <div class="modal-overlay hidden" id="interveneModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Blocca Reparto</div>
        <button style="background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;" onclick="closeInterveneModal()">✕</button>
      </div>
      <form onsubmit="confirmInterveneAction(event)">
        <div class="form-group">
          <label>Motivo del blocco *</label>
          <textarea id="interveneNote" class="form-control" rows="3" required></textarea>
        </div>
        <div style="text-align: right; margin-top: 18px;"><button type="submit" class="btn-gold" style="background:var(--danger-red); color:#fff;">Blocca</button></div>
      </form>
    </div>
  </div>

      { id: 'p_bari', title: 'Caravaggio - Rebel Rock Musical', client: 'Teatro Team Bari', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: 'Giorgio M.', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Analisi vendite e accordi locali.' }], isArchived: false, isExpanded: false },
      { id: 'p_napoli_politeama', title: 'Caravaggio - Rebel Rock Musical', client: 'Teatro Politeama Napoli', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: 'Giorgio M.', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Legal', text: 'Spettacolo annullato.' }], isArchived: false, isExpanded: false },
      { id: 'p_sala_partenope', title: 'Caravaggio - Rebel Rock Musical', client: 'Teatro Sala Partenope', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: 'Giorgio M.', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Valutazione richiesta e disponibilità date.' }], isArchived: false, isExpanded: false },
      { id: 'p_lecce', title: 'Caravaggio - Matinée', client: 'Teatro Lecce', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: 'Giorgio M.', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Organizzazione replica matinée.' }], isArchived: false, isExpanded: false },
      { id: 'p_valjean_pavone', title: 'Valjean', client: 'Teatro del Pavone', showDate: '2027-02-06', ownerInt: 'Giorgio M.', ownerExt: 'Dott. Manzoni', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '07/05', dept: 'Prospect', text: 'Bloccato il cast per 6/7 febbraio 2027 + opzione matinée 8/2.' }], isArchived: false, isExpanded: false },
      { id: 'p_moncalvo', title: 'Domanda Perfetta', client: 'Teatro Civico Moncalvo', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: '', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Inviata richiesta per stagione.' }], isArchived: false, isExpanded: false },
      { id: 'p_esedra', title: 'Domanda Perfetta', client: 'Teatro Esedra', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: '', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Valutazione slot in calendario.' }], isArchived: false, isExpanded: false },
      { id: 'p_villadeati', title: 'Domanda Perfetta', client: 'Villa Deati', showDate: '', ownerInt: 'Fabrizio R.', ownerExt: '', currentStepIdx: 0, approvedSteps: [], statusMessages: [], alertsList: [], notesHistory: [{ date: '02/11', dept: 'Prospect', text: 'Inviata proposta.' }], isArchived: false, isExpanded: false }
    ];

    const initialTodos = [
      { id: 't_1', title: 'Teatro Manzoni Cassino', dept: 'Promo', action: 'Inviare materiali di comunicazione completi e piano promozionale.', assignee: 'Fabrizio', isResolved: false },
      { id: 't_2', title: 'Teatro Politeama Napoli', dept: 'Legal', action: 'Gestione annullamento e aggiornamento cartellone.', assignee: 'Giorgio', isResolved: false },
      { id: 't_3', title: 'Teatro Sala Partenope', dept: 'Tech Serv', action: 'Controllare schede tecniche e capienza.', assignee: 'Fabrizio', isResolved: false },
      { id: 't_4', title: 'Matinée Lecce', dept: 'Promo', action: 'Definire orari e accordi con scuole per Caravaggio.', assignee: 'Giorgio', isResolved: false }
    ];

    const initialLinks = [
      { id: 'l_1', title: 'Materiale Promozionale Caravaggio', description: 'Cartella Google Drive con foto ad alta risoluzione, locandine ed elementi grafici.', url: 'https://drive.google.com/drive/folders/14fnph8GCSP6D_0KYbLLHUbaIs1OzAAkL' },
      { id: 'l_2', title: 'Trailer Video Valjean / Caravaggio', description: 'Video promozionali e trailer per i teatri.', url: 'https://drive.google.com/drive/folders/1OhmBpaOGeRdUmG-dT1Zzpgz2cadJ2A0T' },
      { id: 'l_3', title: 'Sito Ufficiale TicketGate Caravaggio', description: 'Link diretto acquisto e promozioni biglietteria.', url: 'https://www.ticketgate.it/michelangelo-da-caravaggio' },
      { id: 'l_4', title: 'Sito Ufficiale Golden Ticket Company', description: 'Portale ufficiale produzioni.', url: 'https://www.goldenticketcompany.it/' }
    ];

    let pratiche = [];
    let manualTodos = [];
    let archivedTodos = [];
    let utileLinks = [];
    let activeItem = null;
    let selectedStepIdx = null;

    function linkify(inputText) {
      if (!inputText) return '';
      return inputText.replace(/(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function formatDateIt(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    async function loadData() {
      try {
        const { data } = await client.from('workflow').select('data').eq('id', 'main').single();
        if (data && data.data && data.data.pratiche && data.data.pratiche.length > 0) {
          pratiche = data.data.pratiche;
          manualTodos = data.data.manualTodos || initialTodos;
          archivedTodos = data.data.archivedTodos || [];
          utileLinks = data.data.utileLinks || initialLinks;
        } else {
          pratiche = initialPratiche;
          manualTodos = initialTodos;
          archivedTodos = [];
          utileLinks = initialLinks;
          await saveData();
        }
      } catch(e) {
        pratiche = initialPratiche;
        manualTodos = initialTodos;
        archivedTodos = [];
        utileLinks = initialLinks;
      }
      initDropdownOptions();
      renderApp();
    }

    async function saveData() {
      try {
        await client.from('workflow').update({ data: { pratiche, manualTodos, archivedTodos, utileLinks } }).eq('id', 'main');
      } catch (err) {
        console.error('Salvataggio:', err);
      }
      renderApp();
    }

    function renderApp() {
      renderFeed();
      renderTodoList();
      renderLinksList();
      updateArchiveCount();
    }

    function updateArchiveCount() {
      const count = pratiche.filter(p => p.isArchived).length;
      const badge = document.getElementById('archiveCountBadge');
      if (badge) badge.innerText = count;
    }

    function expandAllCards() { pratiche.forEach(p => p.isExpanded = true); renderFeed(); }
    function collapseAllCards() { pratiche.forEach(p => p.isExpanded = false); renderFeed(); }
    function toggleCardExpand(id) {
      const p = pratiche.find(item => item.id === id);
      if (p) { p.isExpanded = !p.isExpanded; renderFeed(); }
    }

    function initDropdownOptions() {
      const selectShow = document.getElementById('filterShowTitle');
      if (!selectShow) return;
      const showsMap = new Map();
      pratiche.forEach(p => { if (p.title) showsMap.set(p.title.trim().toLowerCase(), p.title.trim()); });
      selectShow.innerHTML = '<option value="ALL">🎭 Tutti gli Spettacoli</option>';
      Array.from(showsMap.values()).forEach(title => {
        const opt = document.createElement('option');
        opt.value = title;
        opt.innerText = '🎭 ' + title;
        selectShow.appendChild(opt);
      });
    }

    function renderFeed() {
      const container = document.getElementById('feedList');
      if (!container) return;
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterShow = document.getElementById('filterShowTitle').value;
      const filterDept = document.getElementById('filterDept').value;
      container.innerHTML = '';

      const activePratiche = pratiche.filter(p => !p.isArchived).filter(p => {
        const matchSearch = (p.title || '').toLowerCase().includes(search) || (p.client || '').toLowerCase().includes(search);
        const matchShow = filterShow === 'ALL' || (p.title || '').trim().toLowerCase() === filterShow.trim().toLowerCase();
        return matchSearch && matchShow;
      });

      if (activePratiche.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">Nessuna pratica attiva.</div>`;
        return;
      }

      activePratiche.forEach(p => {
        if (!p.statusMessages) p.statusMessages = [];
        if (!p.alertsList) p.alertsList = [];
        if (!p.approvedSteps) p.approvedSteps = [];

        const stepIdx = p.currentStepIdx || 0;
        let stepperHTML = ROUTE_STEPS.map((s, idx) => {
          let cls = 'step-circle';
          let symbol = idx + 1;
          if (p.approvedSteps.includes(idx)) { cls += ' done'; symbol = '✓'; }
          else if (idx === stepIdx) { cls += ' current-fuchsia'; symbol = '●'; }
          return `<div class="step-item" onclick="openStepClickModal('${p.id}', ${idx})"><div class="${cls}">${symbol}</div><div class="step-label">${s.label}</div></div>`;
        }).join('');

        const isExpanded = !!p.isExpanded;
        const formattedDate = formatDateIt(p.showDate);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleCardExpand('${p.id}')">
            <div>
              <div class="client-title-main">${p.client}</div>
              <div class="card-show-title">${p.title} ${formattedDate ? `<span style="color:var(--gold-light);">🎭 ${formattedDate}</span>` : ''} ${isExpanded ? '' : '<span style="font-size:12px; color:var(--gold-light);">[Apri ▾]</span>'}</div>
            </div>
            <button class="btn-secondary-outline btn-sm" onclick="event.stopPropagation(); openChatModal('${p.id}')">💬 Chat</button>
          </div>
          ${isExpanded ? `
            <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 14px;">
              <div class="stepper-box"><div class="stepper">${stepperHTML}</div></div>
              <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <button class="btn-danger-outline btn-sm" onclick="deletePratica('${p.id}')">Elimina</button>
                <button class="btn-secondary-outline btn-sm" style="background:rgba(56,161,105,0.15); color:#68d391;" onclick="archivePratica('${p.id}')">📦 Archivia</button>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function renderTodoList() {
      const container = document.getElementById('todoList');
      if (!container) return;
      const search = (document.getElementById('searchTodoInput')?.value || '').toLowerCase();
      container.innerHTML = '';

      manualTodos.filter(t => (t.title || '').toLowerCase().includes(search) || (t.action || '').toLowerCase().includes(search)).forEach(t => {
        const item = document.createElement('div');
        item.className = 'todo-card';
        item.innerHTML = `
          <div>
            <span class="todo-badge assignee">👤 ${t.assignee || 'Incaricato'}</span>
            <div style="font-size:16px; font-weight:bold; color:#fff;">${t.title}</div>
            <div class="todo-text-block" style="color:#a0aec0; margin-top:4px;">${linkify(t.action)}</div>
          </div>
          <button class="btn-danger-outline btn-sm" onclick="deleteTodo('${t.id}')">✕</button>
        `;
        container.appendChild(item);
      });
    }

    function renderLinksList() {
      const container = document.getElementById('linksListContainer');
      if (!container) return;
      const search = (document.getElementById('searchLinkInput')?.value || '').toLowerCase();
      container.innerHTML = '';

      utileLinks.filter(l => (l.title || '').toLowerCase().includes(search) || (l.description || '').toLowerCase().includes(search)).forEach(l => {
        const card = document.createElement('div');
        card.className = 'card link-item-card';
        card.innerHTML = `
          <div style="font-size:18px; font-weight:bold; color:var(--gold-light);">${l.title}</div>
          <div style="font-size:14px; color:#fff; margin:6px 0;">${l.description}</div>
          <div style="font-size:14px;">🔗 ${linkify(l.url)}</div>
        `;
        container.appendChild(card);
      });
    }

    function openNewModal() { document.getElementById('newModal').classList.remove('hidden'); }
    function closeNewModal() { document.getElementById('newModal').classList.add('hidden'); }
    function openTodoModal() { document.getElementById('todoModal').classList.remove('hidden'); }
    function closeTodoModal() { document.getElementById('todoModal').classList.add('hidden'); }
    function openLinkModal() { document.getElementById('linkModal').classList.remove('hidden'); }
    function closeLinkModal() { document.getElementById('linkModal').classList.add('hidden'); }

    function openStepClickModal(id, idx) {
      activeItem = pratiche.find(p => p.id === id);
      if (!activeItem) return;
      selectedStepIdx = idx;
      const isCurrent = idx === (activeItem.currentStepIdx || 0);
      document.getElementById('btnApproveNext').style.display = isCurrent ? 'block' : 'none';
      document.getElementById('stepClickModal').classList.remove('hidden');
    }
    function closeStepClickModal() { document.getElementById('stepClickModal').classList.add('hidden'); }

    async function approveAndNext() {
      if (!activeItem) return;
      if (!activeItem.approvedSteps) activeItem.approvedSteps = [];
      activeItem.approvedSteps.push(selectedStepIdx);
      if (activeItem.currentStepIdx < ROUTE_STEPS.length - 1) {
        activeItem.currentStepIdx++;
      }
      closeStepClickModal();
      await saveData();
    }

    function openChatModal(id) {
      activeItem = pratiche.find(p => p.id === id);
      if (!activeItem) return;
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';
      (activeItem.notesHistory || []).forEach(n => {
        box.innerHTML += `<div style="background:#1c0507; padding:10px; border-radius:8px; margin-bottom:8px;"><strong style="color:var(--gold-light);">${n.dept}</strong> (${n.date}): ${linkify(n.text)}</div>`;
      });
      document.getElementById('chatModal').classList.remove('hidden');
    }
    function closeChatModal() { document.getElementById('chatModal').classList.add('hidden'); }

    async function savePratica(e) {
      e.preventDefault();
      pratiche.unshift({
        id: 'p_' + Date.now(),
        title: document.getElementById('formTitle').value,
        client: document.getElementById('formClient').value,
        showDate: document.getElementById('formShowDate').value.trim(),
        ownerExt: document.getElementById('formOwnerExt').value.trim(),
        ownerInt: document.getElementById('formOwnerInt').value.trim(),
        currentStepIdx: 0,
        approvedSteps: [],
        notesHistory: [{ date: new Date().toLocaleDateString(), dept: 'Prospect', text: 'Pratica creata.' }],
        isArchived: false,
        isExpanded: true
      });
      closeNewModal();
      await saveData();
    }

    async function saveManualTodo(e) {
      e.preventDefault();
      manualTodos.unshift({
        id: 't_' + Date.now(),
        title: document.getElementById('todoTitle').value,
        dept: document.getElementById('todoSit').value,
        assignee: document.getElementById('todoAssignee').value,
        action: document.getElementById('todoAction').value,
        isResolved: false
      });
      closeTodoModal();
      await saveData();
    }

    async function saveLinkItem(e) {
      e.preventDefault();
      let url = document.getElementById('linkUrlInput').value.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      utileLinks.unshift({
        id: 'l_' + Date.now(),
        title: document.getElementById('linkTitleInput').value,
        description: document.getElementById('linkDescInput').value,
        url: url
      });
      closeLinkModal();
      await saveData();
    }

    async function deletePratica(id) {
      if (confirm('Eliminare pratica?')) { pratiche = pratiche.filter(p => p.id !== id); await saveData(); }
    }
    async function deleteTodo(id) {
      if (confirm('Eliminare task?')) { manualTodos = manualTodos.filter(t => t.id !== id); await saveData(); }
    }
    async function archivePratica(id) {
      const p = pratiche.find(item => item.id === id);
      if (p) { p.isArchived = true; await saveData(); }
    }
    function openArchiveModal() {
      const container = document.getElementById('archiveListContainer');
      container.innerHTML = '';
      pratiche.filter(p => p.isArchived).forEach(p => {
        container.innerHTML += `<div style="background:#1c0507; padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;"><div><strong style="color:var(--gold-light);">${p.client}</strong> - ${p.title}</div><button class="btn-solve-sm" onclick="unarchivePratica('${p.id}')">↩️ Riapri</button></div>`;
      });
      document.getElementById('archiveModal').classList.remove('hidden');
    }
    function closeArchiveModal() { document.getElementById('archiveModal').classList.add('hidden'); }
    async function unarchivePratica(id) {
      const p = pratiche.find(item => item.id === id);
      if (p) { p.isArchived = false; await saveData(); openArchiveModal(); }
    }

    function switchTab(tab) {
      document.getElementById('sectionFlussi').style.display = tab === 'flussi' ? 'block' : 'none';
      document.getElementById('sectionTodo').style.display = tab === 'todo' ? 'block' : 'none';
      document.getElementById('sectionLinks').style.display = tab === 'links' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'flussi') document.getElementById('btnTabFlussi').classList.add('active');
      if (tab === 'todo') document.getElementById('btnTabTodo').classList.add('active');
      if (tab === 'links') document.getElementById('btnTabLinks').classList.add('active');
    }

    // Modal di supporto vuoti per evitare errori di chiamata
    function openStatusModal() { closeStepClickModal(); }
    function closeStatusModal() {}
    function saveDepartmentStatus(e) { e.preventDefault(); closeStatusModal(); }
    function openSendBackModal() { closeStepClickModal(); }
    function closeSendBackModal() {}
    function saveSendBackAction(e) { e.preventDefault(); closeSendBackModal(); }
    function openInterveneFromStepClick() { closeStepClickModal(); }
    function closeInterveneModal() {}
    function confirmInterveneAction(e) { e.preventDefault(); closeInterveneModal(); }
    function executeFinalDepartment() { closeStepClickModal(); }

    loadData();
  </script>
</body>
</html>
